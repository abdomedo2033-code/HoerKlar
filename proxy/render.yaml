services:
  - type: web
    name: taalflix-proxy
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && curl -fsSL https://deno.land/install.sh | sh
    startCommand: export DENO_INSTALL="$HOME/.deno" && export PATH="$DENO_INSTALL/bin:$PATH" && python yt_proxy.py
    healthCheckPath: /yt/dC6ZGLzdaTs
