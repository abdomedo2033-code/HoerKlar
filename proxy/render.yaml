services:
  - type: web
    name: hoerklar-proxy
    env: python
    plan: free
    buildCommand: env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY pip install -r requirements.txt && curl -fsSL https://deno.land/install.sh | sh && curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg && echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/cloudflare-client.list && apt-get update && apt-get install -y cloudflare-warp && warp-cli --accept-tos register && warp-cli --accept-tos set-mode proxy && warp-cli --accept-tos set-proxy-port 40000
    startCommand: export DENO_INSTALL="$HOME/.deno" && export PATH="$DENO_INSTALL/bin:$PATH" && warp-cli --accept-tos connect || true; export https_proxy=socks5://127.0.0.1:40000; export http_proxy=socks5://127.0.0.1:40000; export ALL_PROXY=socks5://127.0.0.1:40000; python yt_proxy.py
    healthCheckPath: /yt/dC6ZGLzdaTs
