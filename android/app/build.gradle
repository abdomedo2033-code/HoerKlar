plugins { id 'com.android.application' }
android {
    namespace 'com.hoerklar.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.hoerklar.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
    debug { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
}
}
dependencies { implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.22.6' }
