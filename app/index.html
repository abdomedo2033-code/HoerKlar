let cur=null, filtered=[...clips], xp=Number(localStorage.xp||0), streak=Number(localStorage.streak||0), slow=false, subsOn=true, timer=null;
const v=document.getElementById('v');
function load(){ renderStats(); bindFilters(); pickRandom(); }
function bindFilters(){
  document.querySelectorAll('#filters [data-cefr]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#filters [data-cefr]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); applyFilter(); });
  document.getElementById('qtype').onchange=applyFilter;
  document.getElementById('play').onclick=playClip;
  document.getElementById('replay').onclick=playClip;
  document.getElementById('slow').onclick=()=>{ slow=!slow; v.playbackRate=slow?0.75:1; document.getElementById('slow').textContent=slow?'1×':'0.75×'; };
  document.getElementById('sub').onclick=()=>{ subsOn=!subsOn; document.getElementById('sub').textContent=subsOn?'Subtitles ON':'Subtitles OFF'; renderQuiz(); };
  document.getElementById('next').onclick=()=>pickRandom();
  const dc=document.getElementById('dictCheck'); if(dc) dc.onclick=checkDict;
  const bv=document.getElementById('browserWhisperBtn'); if(bv) bv.onclick=browserWhisper;
}
function applyFilter(){
  const cefr=document.querySelector('#filters .active').dataset.cefr;
  const qt=document.getElementById('qtype').value; 
  filtered=clips.filter(c=> (cefr==='all'||c.cefr===cefr) && (qt==='all'||c.question_type===qt));
  if(!filtered.length) filtered=[...clips];
  pickRandom();
}
function pickRandom(){
  cur=filtered[Math.floor(Math.random()*filtered.length)];
  renderQuiz(); setupPlayer();
  document.getElementById('feedback').textContent=''; document.getElementById('next').style.display='none';
  const ci=document.getElementById('clipInfo'); if(ci) ci.textContent='';
}
let ytPlayer=null, vmPlayer=null;
function ensureYT(){ if(!document.querySelector('script[data-yt]')){ const s=document.createElement('script'); s.src="https://www.youtube.com/iframe_api"; s.dataset.yt="1"; document.head.appendChild(s);} }
function ensureVimeo(){ if(!document.querySelector('script[data-vm]')){ const s=document.createElement('script'); s.src="https://player.vimeo.com/api/player.js"; s.dataset.vm="1"; document.head.appendChild(s);} }
function setupPlayer(){
  clearInterval(timer);
  let ov=document.getElementById('clipOverlay'); if(!ov){ ov=document.createElement('div'); ov.id='clipOverlay'; ov.style.cssText='position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.75);color:#7CFF9A;padding:4px 8px;border-radius:6px;font:12px monospace;z-index:2'; document.getElementById('playerWrap').style.position='relative'; document.getElementById('playerWrap').appendChild(ov); }
  ov.textContent=`CLIP ${cur.clip_id} — ${cur.start_time}–${cur.end_time}s (${(cur.end_time-cur.start_time).toFixed(1)}s) — ${cur.cefr}`;
  document.getElementById('attribution').innerHTML=`<a href="${cur.embed_url}" target="_blank">${cur.title}</a> · <a href="${cur.license_url}" target="_blank">${cur.license}</a> · ✅ Verified — video stays on provider`;
  const isYT=cur.provider==='youtube', isVM=cur.provider==='vimeo', isArch=cur.provider==='archive_embed';
  const vEl=document.getElementById('v'), ytW=document.getElementById('ytWrap'), vmF=document.getElementById('vm');
  document.getElementById('yt').style.display=isYT?'block':'none';
  const archF=document.getElementById('arch');
  if(isYT || isVM || isArch){ vEl.style.display='none'; ytW.style.display='block'; } else { vEl.style.display='block'; ytW.style.display='none'; }
  if(isVM){ vmF.style.display='block'; vmF.src=cur.video_url; } else { vmF.style.display='none'; vmF.src=''; }
  if(isArch){ archF.style.display='block'; archF.src=cur.video_url; } else { archF.style.display='none'; archF.src=''; }
  if(isYT){
    ensureYT();
    const init=()=>{ if(window.YT && window.YT.Player){ try{ if(ytPlayer) ytPlayer.destroy(); }catch(e){}; ytPlayer=new window.YT.Player('yt',{videoId:cur.video_id.split('?')[0].split('/') .pop(), playerVars:{modestbranding:1,rel:0,playsinline:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,cc_load_policy:0}, events:{onReady:(e)=>{ setTimeout(function(){ playClip(); },400);, onError:(e)=>{ document.getElementById('attribution').innerHTML+=` <br><span style='color:#FF8A8A'>⚠️ تضمين محظور — <a href="${cur.embed_url}" target="_blank" style="color:#b8c0ff">شاهد على YouTube ↗</a></span>`; }}}); } else setTimeout(init,500); };
    init();
    document.getElementById('time').textContent=`Clip ${cur.start_time}–${cur.end_time}s (YouTube clip-only)`;
    return;
  }
  if(isArch){
    document.getElementById('time').textContent=`Archive movie — full play (German dub)`;
    return;
  }
  if(isVM){
    ensureVimeo();
    vmF.onload=()=>{ try{ const p=new window.Vimeo.Player(vmF); p.setCurrentTime(cur.start_time).then(()=>p.pause()); vmPlayer=p; }catch(e){} };
    document.getElementById('time').textContent=`Clip ${cur.start_time}–${cur.end_time}s (Vimeo clip-only)`;
    return;
  }
  v.pause(); v.controls=false; v.src=cur.video_url; v.load();
  v.onerror=()=>{ const fb=document.getElementById('feedback'); if(fb) fb.innerHTML=`Proxy offline — <a href="${cur.embed_url}" target="_blank" style="color:#b8c0ff">Watch on YouTube ↗</a>`; };
  const seek=()=>{ try{ v.currentTime=cur.start_time; v.pause(); }catch(e){} document.getElementById('time').textContent=`Clip ${cur.start_time}–${cur.end_time}s (${(cur.end_time-cur.start_time).toFixed(1)}s)`; };
  v.onloadedmetadata=seek; v.onloadeddata=seek; v.addEventListener('canplay',function ap(){ v.removeEventListener('canplay',ap); try{ v.currentTime=cur.start_time; }catch(e){} setTimeout(playClip,90); },{once:true}); setTimeout(seek,400);
}
function playClip(){
  const isYT=cur.provider==='youtube', isVM=cur.provider==='vimeo', isArch=cur.provider==='archive_embed';
  const prog=document.getElementById('clipProg');
  if(isYT && ytPlayer && ytPlayer.seekTo){ ytPlayer.seekTo(cur.start_time,true); ytPlayer.playVideo(); const t=setInterval(()=>{ try{ const c=ytPlayer.getCurrentTime(); if(prog) prog.style.width=((c-cur.start_time)/(cur.end_time-cur.start_time)*100)+'%'; if(c>=cur.end_time){ ytPlayer.pauseVideo(); clearInterval(t); if(prog) prog.style.width='100%'; } }catch(e){} },100); return; }
  if(isVM && vmPlayer){ vmPlayer.setCurrentTime(cur.start_time).then(()=>vmPlayer.play()); const t2=setInterval(()=>{ vmPlayer.getCurrentTime().then((c)=>{ if(prog) prog.style.width=((c-cur.start_time)/(cur.end_time-cur.start_time)*100)+'%'; if(c>=cur.end_time){ vmPlayer.pause(); clearInterval(t2); if(prog) prog.style.width='100%'; }}); },100); return; }
  if(isVM){ const vmF=document.getElementById('vm'); try{ const p=new window.Vimeo.Player(vmF); p.setCurrentTime(cur.start_time).then(()=>p.play()); vmPlayer=p; }catch(e){} return; }
  v.playbackRate=slow?0.75:1; v.play().catch(()=>{});
  v.ontimeupdate=()=>{
    if(prog) prog.style.width=((v.currentTime-cur.start_time)/(cur.end_time-cur.start_time)*100)+'%';
    if(v.currentTime>=cur.end_time){ v.pause(); v.ontimeupdate=null; if(prog) prog.style.width='100%'; }
  };
}
function safeReplace(text, find, rep){
  if(!find) return text;
  return text.split(find).join(rep);
}
function renderQuiz(){
  const d=document.getElementById('dutch'), q=document.getElementById('question'), o=document.getElementById('options'), db=document.getElementById('dictBox');
  let dutchShown = cur.dutch_text;
  if(cur.question_type==='vocab' && cur.correct_answer){
    dutchShown = safeReplace(cur.dutch_text, cur.correct_answer, '⟦'+cur.correct_answer+'⟧');
  }
  d.textContent= cur.question_type==='dictation' ? '🔊 Dictation — type what you hear' : (subsOn?dutchShown:'🔊 Listen and answer');
  const labels={
    translation:'Choose correct translation (relevant to clip)',
    listening:'What did you hear in the clip?',
    cloze:`Fill blank: "${safeReplace(cur.dutch_text, cur.correct_answer, '___')}"`,
    vocab:`What does the word ⟦${cur.correct_answer}⟧ mean?`,
    grammar:'Choose correct translation',
    dictation:'Type the Dutch you heard (clip only)'
  };
  q.textContent=labels[cur.question_type]||'Answer';
  o.innerHTML=''; if(db) db.style.display='none';
  if(cur.question_type==='dictation'){ if(db){ db.style.display='flex'; document.getElementById('dictInput').value=''; } return; }
  const opts=[cur.correct_answer, ...cur.wrong_answers].sort(()=>Math.random()-0.5);
  opts.forEach(t=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>answer(t,b); o.appendChild(b); });
}
function answer(chosen, btn){
  const ok=chosen===cur.correct_answer;
  [...document.getElementById('options').children].forEach(b=>{ b.disabled=true; if(b.textContent===cur.correct_answer) b.classList.add('correct'); else if(b===btn&&!ok) b.classList.add('wrong'); });
  const fb=document.getElementById('feedback');
  if(ok){ xp+=10; streak+=1; fb.textContent='✓ Correct! +10 XP'; fb.style.color='#7CFF9A'; } else { streak=0; fb.textContent=`✗ Correct: "${cur.correct_answer}" — ${cur.english_translation}`; fb.style.color='#FF8A8A'; }
  localStorage.xp=xp; localStorage.streak=streak; renderStats(); document.getElementById('next').style.display='inline-block';
}
function checkDict(){
  const val=document.getElementById('dictInput').value.trim();
  const ok=val.toLowerCase()===cur.dutch_text.toLowerCase();
  const fb=document.getElementById('feedback');
  if(ok){ xp+=15; streak+=1; fb.textContent='✓ Perfect! +15 XP'; fb.style.color='#7CFF9A'; } else { streak=0; fb.textContent=`✗ Expected: "${cur.dutch_text}"`; fb.style.color='#FF8A8A'; }
  localStorage.xp=xp; localStorage.streak=streak; renderStats(); document.getElementById('next').style.display='inline-block';
}
function renderStats(){ document.getElementById('xp').textContent=xp; document.getElementById('streak').textContent=streak; document.getElementById('level').textContent= xp<50?'A1':xp<150?'A2':xp<300?'B1':'B2'; }
window.browserWhisper = async function(){
  const st=document.getElementById('whisperStatus'); if(!st) return;
  try{
    st.textContent='Downloading whisper-tiny ~40MB...';
    const mod=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js');
    const pipe=await mod.pipeline('automatic-speech-recognition','Xenova/whisper-tiny',{quantized:true});
    st.textContent='Fetching clip audio... (use terminal for clip-only slice)';
    st.textContent='Whisper ready — for clip-only accurate use terminal: ~/whisperenv/bin/python /home/deck/Downloads/Dutch_App/app/auto_verify.py';
  }catch(e){ st.textContent='Error: '+e.message; }
}
load();
